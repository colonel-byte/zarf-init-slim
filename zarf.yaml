---
# yaml-language-server: $schema=https://raw.githubusercontent.com/zarf-dev/zarf/main/zarf.schema.json
apiVersion: zarf.dev/v1beta1
kind: ZarfInitConfig
metadata:
  name: init-slim
  # renovate: datasource=docker depName=ghcr.io/zarf-dev/zarf/agent
  version: v1.0.1
  annotations:
    org.opencontainers.image.source: "https://github.com/colonel-byte/zarf-slim-init"
values:
  files:
    - values/init-slim.yaml
components:
  # Injects the seed registry into the cluster; upstream publishes one multi-arch
  # component config, so no architecture selector is needed.
  - name: zarf-injector
    optional: true
    import:
      remote:
        # renovate: datasource=docker
        - url: oci://ghcr.io/zarf-dev/components/init/zarf-injector:v1.0.1

  # Bootstraps the registry from the injected registry image
  - name: zarf-seed-registry
    optional: true
    import:
      remote:
        # renovate: datasource=docker
        - url: oci://ghcr.io/zarf-dev/components/init/zarf-seed-registry:v1.0.1
    charts:
      # Adds to the upstream `.registry` mapping rather than replacing it, so the seed
      # registry inherits the shared settings and overrides only what it needs.
      - name: docker-registry
        values:
          - sourcePath: .seedRegistry
            targetPath: .
    images:
      # renovate: datasource=docker depName=ghcr.io/distribution/distribution
      - name: ghcr.io/distribution/distribution:3.1.2
        id: registry
      # renovate: datasource=docker depName=docker.io/alpine/socat
      - name: docker.io/alpine/socat:1.8.1.3
        id: proxy

  # Creates the permanent registry
  - name: zarf-registry
    optional: true
    import:
      remote:
        # renovate: datasource=docker
        - url: oci://ghcr.io/zarf-dev/components/init/zarf-registry:v1.0.1
    images:
      # renovate: datasource=docker depName=ghcr.io/distribution/distribution
      - name: ghcr.io/distribution/distribution:3.1.2
        id: registry
      # renovate: datasource=docker depName=docker.io/alpine/socat
      - name: docker.io/alpine/socat:1.8.1.3
        id: proxy

  # Creates the pod+git mutating webhook
  - name: zarf-agent
    optional: true
    import:
      remote:
        # renovate: datasource=docker
        - url: oci://ghcr.io/zarf-dev/components/init/zarf-agent:v1.0.1

  # Adds a git server to the cluster
  - name: git-server
    optional: true
    import:
      remote:
        # renovate: datasource=docker
        - url: oci://ghcr.io/zarf-dev/components/init/git-server:v1.0.1
    images:
      # renovate: datasource=docker depName=ghcr.io/go-gitea/gitea
      - name: ghcr.io/go-gitea/gitea:28.3.0-rootless
        id: git-server
