---
registry:
  tolerations:
    - operator: Exists
  proxy:
    tolerations:
      - operator: Exists
  serviceAccount:
    create: true
    name: docker-registry
  affinity:
    enabled: true
    custom:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: adrp.xyz/is-infra
                  operator: In
                  values:
                    - "true"
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - docker-registry
              topologyKey: kubernetes.io/hostname
# Overrides on top of `registry`, for the ephemeral registry that only exists until the
# permanent one is up: no volume to provision and no replicas to scale.
seedRegistry:
  persistence:
    enabled: false
  autoscaling:
    enabled: false
agent:
  tolerations:
    - operator: Exists
