---
imagePullSecrets:
  - name: private-registry

secrets:
  htpasswd: "###ZARF_HTPASSWD###"
  configData:
    http:
      secret: "###ZARF_REGISTRY_SECRET###"

service:
  nodePort: "###ZARF_NODEPORT###"

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 3
    memory: 2Gi

fullnameOverride: "zarf-docker-registry"

podLabels:
  zarf.dev/agent: "ignore"

affinity:
  enabled: true
  custom:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: "###ZARF_VAR_NODE_INFRASTRUCTURE_LABEL###"
                operator: In
                values:
                  - "true"
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app
                  operator: In
                  values:
                    - docker-registry
            topologyKey: kubernetes.io/hostname

tolerations:
  - operator: Exists

caBundle: |
  ###ZARF_VAR_REGISTRY_CA_BUNDLE###

serviceAccount:
  create: true
  name: docker-registry
  annotations: {}
