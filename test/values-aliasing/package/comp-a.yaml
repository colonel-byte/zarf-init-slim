---
# comp-a maps .shared and no other path. The two component configs are identical except
# for metadata.name.
#
# Nothing here is contacted.
apiVersion: zarf.dev/v1beta1
kind: ZarfComponentConfig
metadata:
  name: comp-a
component:
  charts:
    - name: demo
      namespace: comp-a
      local:
        path: chart
      values:
        - sourcePath: .shared
          targetPath: .
